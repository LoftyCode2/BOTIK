<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Просмотр видео</title>
    
    <!-- Теги для красивого предпросмотра в Telegram -->
    <meta property="og:type" content="video.other" />
    <meta property="og:title" content="Название вашего видео" />
    <meta property="og:video" content="https://github.io" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />
</head>
<body style="background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <!-- Этот блок уберет белый экран и покажет видео на сайте -->
    <video controls autoplay loop style="max-width: 90%; max-height: 90vh; border-radius: 8px;">
        <source src="https://github.io" type="video/mp4">
        Ваш браузер не поддерживает встроенные видео.
    </video>

</body>
</html>
